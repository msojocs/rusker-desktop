  zh-CN: "容器使用的镜像已不在本地镜像列表中，请刷新后重试。"
images.remove.in_use:
  en: "This image is used by a container (including stopped ones), so the Engine will refuse to delete it. Delete those containers first."
  zh-CN: "此镜像正被容器使用（包括已停止的容器），Engine 会拒绝删除。请先删除相关容器。"
