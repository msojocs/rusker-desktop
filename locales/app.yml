  en: "Appearance"
  zh-CN: "外观"
app.general.theme_hint:
  en: "Theme and language preview immediately and are saved when you click \"Apply\"."
  zh-CN: "主题和语言立即预览，点击“应用”后保存。"
app.general.config_path:
  en: "Rusker config file: %{path}"
  zh-CN: "Rusker 配置文件：%{path}"
app.vm.external_title:
  en: "External Engine"
  zh-CN: "外部 Engine"
app.vm.external_body:
  en: "The current Engine is not managed by Rusker (not Windows, or DOCKER_HOST is set). CPU, memory and disk are configured by that Engine."
  zh-CN: "当前 Engine 不由 Rusker 管理（非 Windows 或设置了 DOCKER_HOST），CPU、内存和磁盘由该 Engine 自行配置。"
app.vm.wsl_backend_title:
  en: "WSL 2 backend"
  zh-CN: "WSL 2 后端"
app.vm.wsl_backend_body:
  en: "You are using the WSL 2 backend; resource limits are managed by Windows."
  zh-CN: "你正在使用 WSL 2 后端，资源限制由 Windows 管理。"
app.vm.wslconfig_prefix:
  en: "You can configure the memory, CPU and swap limits available to WSL 2 in the"
  zh-CN: "可以在"
app.vm.wslconfig_file:
  en: ".wslconfig file"
  zh-CN: ".wslconfig 文件"
app.vm.wslconfig_suffix:
  en: "."
  zh-CN: "中配置 WSL 2 可用的内存、CPU 和交换空间上限。"
app.vm.disk_location:
  en: "Disk image location"
  zh-CN: "磁盘镜像位置"
app.browse:
  en: "Browse…"
  zh-CN: "浏览…"
app.vm.disk_hint_installed:
  en: "Directory containing the Docker data disk (docker-data.vhdx, which stores images, containers and volumes). Choose a new directory and apply to move it; other WSL distributions are not affected."
  zh-CN: "Docker 数据磁盘（docker-data.vhdx，存放镜像、容器和卷）所在目录。选择新目录并应用即可移动，不影响其他 WSL 发行版。"
app.vm.disk_hint_new:
  en: "Directory where the Docker data disk (docker-data.vhdx, which stores images, containers and volumes) is created."
  zh-CN: "Docker 数据磁盘（docker-data.vhdx，存放镜像、容器和卷）的创建目录。"
app.vm.disk_move_warning:
  en: "Applying stops the Engine and moves the data disk, stopping running containers; moving a large disk across drives may take several minutes."
  zh-CN: "应用后会停止 Engine 并移动数据磁盘，运行中的容器会被停止；跨磁盘移动较大的数据时可能需要数分钟。"
app.saver.threshold_seconds:
  en: "30 seconds"
  zh-CN: "30 秒"
app.saver.threshold_minutes:
  en: "%{minutes} minutes"
  zh-CN: "%{minutes} 分钟"
app.saver.enable:
  en: "Enable Resource Saver"
  zh-CN: "启用资源节省"
app.saver.hint_managed:
  en: "Pauses the Engine when no containers are running and no WSL integration is enabled, keeping the WSL distribution and data disk for a fast resume. Windows clients resume it automatically on the next connection; memory reclaim is managed by WSL."
  zh-CN: "没有运行中的容器且未启用 WSL 集成时暂停 Engine，保留 WSL 发行版和数据盘以便快速恢复。Windows 客户端再次连接时自动继续；内存回收由 WSL 管理。"
app.saver.hint_unmanaged:
  en: "Resource Saver only applies to the WSL2 Engine managed by Rusker. The current Engine is not managed by Rusker."
  zh-CN: "资源节省只作用于 Rusker 管理的 WSL2 Engine，当前 Engine 不由 Rusker 管理。"
app.saver.active_title:
  en: "Resource Saver mode is active"
  zh-CN: "正处于资源节省模式"
app.saver.active_body:
  en: "The Engine is paused. Run a docker command or refresh Rusker to resume it."
  zh-CN: "Engine 已暂停。运行 docker 命令或刷新 Rusker 即可恢复。"
app.saver.threshold:
  en: "Resource Saver threshold"
  zh-CN: "资源节省阈值"
app.saver.seconds_unit:
  en: "seconds"
  zh-CN: "秒"
app.saver.threshold_hint:
  en: "Drag the slider to set how long to wait after no containers are running before entering Resource Saver mode (30 seconds to 60 minutes)."
  zh-CN: "拖动滑块设置从没有运行中的容器到进入资源节省模式之间的等待时间（30 秒到 60 分钟）。"
app.proxy.engine_title:
  en: "Docker Engine proxy"
  zh-CN: "Docker Engine 代理"
app.proxy.engine_hint:
  en: "Proxy used for outbound requests such as image pulls and pushes. Applied directly to the managed Engine's daemon.json and takes effect immediately."
  zh-CN: "Engine 拉取或推送镜像等出站请求使用的代理。应用后直接写入受管 Engine 的 daemon.json 并生效。"
app.proxy.no_restart:
  en: "Does not restart the Engine"
  zh-CN: "不会重启 Engine"
app.proxy.manual_apply:
  en: "Requires manual application"
  zh-CN: "需要手动应用"
app.proxy.managed_hint:
  en: "As in Docker Desktop, the Engine always connects out through Rusker's built-in proxy, and proxy settings take effect per request on Windows: 127.0.0.1 refers to the Windows host, regardless of the WSL networking mode (NAT/mirrored). No Engine restart is needed after changes, and system proxy changes are picked up automatically."
  zh-CN: "与 Docker Desktop 相同，Engine 始终经 Rusker 内置代理出网，代理设置在 Windows 上逐个请求生效：127.0.0.1 指 Windows 本机，与 WSL 网络模式（NAT/mirrored）无关；修改后无需重启 Engine，系统代理的变化也会自动跟随。"
app.proxy.unmanaged_hint:
  en: "The current Engine is not managed by Rusker, so its configuration cannot be changed directly. Export it and merge proxies into daemon.json manually, then restart the Engine; do not overwrite other settings in daemon.json."
  zh-CN: "当前 Engine 不由 Rusker 管理，无法直接修改其配置。请导出后手动合并 proxies 到 daemon.json 并重启 Engine；不要覆盖 daemon.json 中的其他配置。"
app.proxy.export:
  en: "Export Engine JSON"
  zh-CN: "导出 Engine JSON"
app.proxy.export_path:
  en: "Export to: %{path}"
  zh-CN: "导出到：%{path}"
app.proxy.container_title:
  en: "Container proxy"
  zh-CN: "容器代理"
app.proxy.container_hint:
  en: "Proxy for outbound traffic from running containers, passed to new containers as the HTTP_PROXY / HTTPS_PROXY / NO_PROXY environment variables."
  zh-CN: "运行中容器的出站流量使用的代理，新建容器时以 HTTP_PROXY / HTTPS_PROXY / NO_PROXY 环境变量传入。"
app.proxy.new_containers_only:
  en: "Only applies to new containers"
  zh-CN: "仅对新建容器生效"
app.proxy.new_containers_body:
  en: "Applying writes proxies.default in the Docker client config %{path} (preserving other settings), so docker run / docker build pass the proxy automatically; existing containers must be recreated. Inside a container, 127.0.0.1 refers to the container itself, so use the host's LAN address."
  zh-CN: "应用后写入 Docker 客户端配置 %{path} 的 proxies.default（保留其他配置），docker run / docker build 会自动传入代理；已有容器需重新创建。容器内的 127.0.0.1 指向容器自身，请使用宿主机的局域网地址。"
app.lan.mirrored:
  en: "WSL uses mirrored networking: published ports appear directly on the Windows network, and LAN devices can reach them via this machine's IP."
  zh-CN: "WSL 使用镜像网络：已发布端口直接出现在 Windows 网络上，局域网设备可通过本机 IP 访问。"
app.lan.nat_localhost:
  en: "WSL uses NAT networking: ports are bound to localhost only and not forwarded to the LAN."
  zh-CN: "WSL 使用 NAT 网络：端口仅绑定本机，不转发到局域网。"
app.lan.no_ports:
  en: "No ports need forwarding right now"
  zh-CN: "当前没有需要转发的端口"
app.lan.more_ports:
  en: " and %{count} more"
  zh-CN: " 等 %{count} 个"
app.lan.forwarded:
  en: "Forwarded %{ports}"
  zh-CN: "已转发 %{ports}"
app.lan.nat:
  en: "WSL uses NAT networking: as in Docker Desktop, Rusker listens on Windows for ports published on all interfaces (TCP/UDP, IPv4 and IPv6) and forwards them to the VM, so LAN devices can reach them via this machine's IP (%{ports}). On the first listen, allow Rusker network access in the Windows firewall prompt."
  zh-CN: "WSL 使用 NAT 网络：与 Docker Desktop 相同，Rusker 在 Windows 上监听发布到所有接口的端口（TCP/UDP，IPv4 与 IPv6）并转发到 VM，局域网设备可通过本机 IP 访问（%{ports}）。首次监听时请在 Windows 防火墙提示中允许 Rusker 访问网络。"
app.lan.other:
  en: "WSL networking mode is %{mode}; Rusker does not forward ports."
  zh-CN: "WSL 网络模式为 %{mode}，Rusker 不转发端口。"
app.network.hint:
  en: "Configure how Docker containers interact with the network."
  zh-CN: "配置 Docker 容器与网络交互的方式。"
app.network.subnet:
  en: "Docker subnet"
  zh-CN: "Docker 子网"
app.network.subnet_hint:
  en: "IPv4 subnet used by the default bridge network (docker0); leave empty to use Docker's default. Change it if it conflicts with your LAN or VPN subnet; existing containers must be recreated to use the new subnet."
  zh-CN: "默认 bridge 网络（docker0）使用的 IPv4 网段，留空则使用 Docker 默认值。与局域网或 VPN 网段冲突时可修改；已有容器需重新创建才会使用新网段。"
app.network.host_networking:
  en: "Enable host networking"
  zh-CN: "启用主机网络"
app.network.host_networking_hint:
  en: "TCP and UDP ports listened on by containers started with --net=host are also forwarded on Windows: reachable from the LAN under NAT networking, and UDP also via localhost. TCP on localhost is forwarded by WSL itself and is not affected by this toggle; no forwarding is needed under mirrored networking. Takes effect immediately without restarting the Engine."
  zh-CN: "以 --net=host 启动的容器监听的 TCP 和 UDP 端口也会在 Windows 上转发：NAT 网络下局域网设备可访问，UDP 也可通过 localhost 访问。localhost 上的 TCP 由 WSL 自身转发，不受此开关影响；镜像网络下无需转发。应用后立即生效，不会重启 Engine。"
app.network.port_binding:
  en: "Port binding behavior"
  zh-CN: "端口绑定行为"
app.network.port_binding_hint:
  en: "Controls whether published container ports bind to all network interfaces (default) or only to 127.0.0.1. Addresses set explicitly in a port mapping (such as 0.0.0.0:8080:80) are not affected."
  zh-CN: "控制发布的容器端口绑定到所有网络接口（默认），还是只绑定到 127.0.0.1。端口映射中显式指定的地址（如 0.0.0.0:8080:80）不受影响。"
app.network.default_mode:
  en: "Default networking mode"
  zh-CN: "默认网络模式"
app.network.default_mode_hint:
  en: "Applies to the default bridge network and bridge networks created afterwards; it can still be set per network (docker network create --ipv6)."
  zh-CN: "作用于默认 bridge 网络和之后新建的 bridge 网络，创建网络时仍可单独指定（docker network create --ipv6）。"
app.network.ipv6_hint:
  en: "The default bridge network uses the IPv6 subnet fd00:7275:736b::/64; new networks are allocated from Docker's IPv6 address pool."
  zh-CN: "默认 bridge 网络使用 IPv6 子网 fd00:7275:736b::/64，新建网络从 Docker 的 IPv6 地址池分配。"
app.network.restarts_engine:
  en: "Restarts the Engine"
  zh-CN: "会重启 Engine"
app.network.managed_hint:
  en: "Network configuration is written to the managed Engine's daemon.json; when it changes, the Engine restarts and running containers are stopped."
  zh-CN: "网络配置写入受管 Engine 的 daemon.json，变化时 Engine 会重启，运行中的容器会被停止。"
app.learn_more:
