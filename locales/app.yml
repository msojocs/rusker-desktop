app.proxy.http_label:
  en: "Web server (HTTP)"
  zh-CN: "Web 服务器（HTTP）"
app.proxy.http_hint:
  en: "Supports http:// or https://; embedded usernames and passwords are not saved."
  zh-CN: "支持 http:// 或 https://，不保存内嵌用户名或密码。"
app.proxy.https_label:
  en: "Secure web server (HTTPS)"
  zh-CN: "安全 Web 服务器（HTTPS）"
app.proxy.https_hint:
  en: "Proxy address for HTTPS requests; an http:// proxy is also allowed."
  zh-CN: "HTTPS 请求使用的代理地址，也可以填写 http:// 代理。"
app.proxy.no_proxy_label:
  en: "Bypass proxy for these hosts and domains"
  zh-CN: "对以下主机和域名不使用代理"
app.proxy.no_proxy_hint:
  en: "Comma-separated, e.g. registry-1.docker.com,*.docker.com,10.0.0.0/8"
  zh-CN: "逗号分隔，例如 registry-1.docker.com,*.docker.com,10.0.0.0/8"
app.proxy.no_proxy_detected:
  en: "No usable HTTP/HTTPS proxy detected; connecting directly."
  zh-CN: "当前未检测到可用的 HTTP/HTTPS 代理，将直接连接。"
app.proxy.none:
  en: "(none)"
  zh-CN: "（无）"
app.proxy.current:
  en: "Currently in effect: HTTP %{http} · HTTPS %{https} · Bypass %{no_proxy}"
  zh-CN: "当前生效：HTTP %{http} · HTTPS %{https} · 不使用代理 %{no_proxy}"
app.error.client_config_dir:
  en: "Could not determine the Docker client config directory; the container proxy only applies to containers created by Rusker"
  zh-CN: "无法确定 Docker 客户端配置目录，容器代理仅对 Rusker 创建的容器生效"
app.error.write_client_proxy:
  en: "Failed to write the container proxy to %{path}: %{error}"
  zh-CN: "写入容器代理到 %{path} 失败：%{error}"
app.list_separator:
  en: ", "
  zh-CN: "、"
