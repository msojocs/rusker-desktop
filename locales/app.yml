app.runtime.engine_hint:
  en: "The Engine does not listen on TCP. On Windows, run: docker context create rusker --docker host=npipe:////./pipe/rusker_engine. Quitting Rusker stops the Engine. Installing or repairing may take a few minutes; Engine logs are in the dedicated distribution at /var/log/rusker-dockerd.log."
  zh-CN: "Engine 不监听 TCP 端口。Windows 工具可执行：docker context create rusker --docker host=npipe:////./pipe/rusker_engine。退出 Rusker 时会停止 Engine。安装或修复可能需要数分钟，Engine 日志位于专用发行版的 /var/log/rusker-dockerd.log。"
app.daemon.intro_prefix:
  en: "Configure the Engine by editing the Docker daemon"
  zh-CN: "通过编辑 JSON 格式的 Docker daemon"
app.daemon.config_file_link:
  en: "configuration file"
  zh-CN: "配置文件"
app.daemon.intro_suffix:
  en: "in JSON format."
  zh-CN: "来配置 Engine。"
app.daemon.advanced_title:
  en: "Advanced settings"
  zh-CN: "高级设置"
app.daemon.advanced_body:
  en: "Incorrect configuration may prevent Docker from starting, so edit with care. It is validated with dockerd --validate before applying; applying restarts the Engine and stops running containers. proxies is managed by the \"Proxies\" settings, and network options such as bip, ip and ipv6 by the \"Network\" settings; they are not shown here."
  zh-CN: "错误的配置可能导致 Docker 无法启动，请谨慎修改。应用前会用 dockerd --validate 校验，应用后 Engine 会重启，运行中的容器会被停止。proxies 由“代理”设置管理，bip、ip、ipv6 等网络配置由“网络”设置管理，不在此显示。"
app.daemon.file_label:
  en: "Daemon configuration file"
  zh-CN: "Daemon 配置文件"
app.daemon.reading:
  en: "Reading…"
  zh-CN: "读取中…"
app.daemon.reload:
  en: "Reload"
  zh-CN: "重新读取"
app.daemon.unmanaged_hint:
  en: "The current Engine is not managed by Rusker (DOCKER_HOST is set). Edit that Engine's daemon.json directly."
  zh-CN: "当前 Engine 不由 Rusker 管理（设置了 DOCKER_HOST），请直接编辑该 Engine 的 daemon.json。"
app.wsl.integration_hint:
  en: "The toggle installs or removes the Rusker-marked Docker CLI wrapper and Compose/Buildx plugins, which connect to the shared socket by default; it is not a security boundary against manual access."
  zh-CN: "开关安装或移除 Rusker 标记的 Docker CLI 包装器及 Compose/Buildx 插件，默认连接共享 socket；它不是防止手动访问的安全边界。"
app.wsl.no_distros:
  en: "No other WSL2 distributions found to integrate."
  zh-CN: "没有发现可集成的其他 WSL2 发行版。"
app.wsl.default_distro:
  en: "%{name} (default)"
  zh-CN: "%{name}（默认）"
app.wsl.apply_hint:
  en: "Integrations take effect after you click \"Apply\". In Resource Saver mode, docker commands inside a WSL distribution cannot wake the Engine; use the Windows endpoint or Rusker to resume it."
  zh-CN: "点击“应用”后集成才会生效。资源节省模式下 WSL 发行版内的 docker 命令无法唤醒 Engine，请通过 Windows 端点或 Rusker 恢复。"
app.settings_warning:
  en: "Settings warning"
  zh-CN: "设置警告"
