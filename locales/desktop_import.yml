_version: 2
desktop_import.intro:
  en: "Import stopped containers and Compose projects from Docker Desktop or Rancher Desktop on this machine into Rusker. Cross-machine imports are not supported. Scanning only reads source information and does not require the target Engine to be connected."
  zh-CN: "将本机 Docker Desktop 或 Rancher Desktop 中已停止的容器和 Compose 项目导入 Rusker。不支持跨机器导入。扫描只读取源信息，不要求目标 Engine 已连接。"
desktop_import.source_label:
  en: "Import source"
  zh-CN: "导入来源"
desktop_import.hint.docker_desktop:
  en: "Start Docker Desktop and switch to Linux containers first"
  zh-CN: "请先启动 Docker Desktop 并切换到 Linux 容器"
desktop_import.hint.rancher_desktop:
  en: "Start Rancher Desktop and select dockerd (moby); the containerd/nerdctl backend is not supported"
  zh-CN: "请先启动 Rancher Desktop 并选择 dockerd (moby)；不支持 containerd/nerdctl 后端"
desktop_import.callout.title:
  en: "Copy import, not a migration or sync"
  zh-CN: "复制导入，不是迁移或同步"
desktop_import.callout.body:
  en: "Only same-machine Docker Desktop/Rancher Desktop to Rusker imports are supported. Compose projects are imported as a group. Project YAML, .env files, and project directories stay in place and are not modified or copied; bind mounts continue sharing the original data, so do not run both copies at once. Local bridge networks and ordinary local named volumes are migrated with their original names and labels; same-name target resources are never overwritten. IP addresses and subnets may change. Only existing services are imported; rootfs is flattened, so a later Compose up may recreate containers. Source containers and original volume data are unchanged; volume copying creates and cleans up read-only helper containers and may prepare a busybox image. Reserve space for target data and for the rootfs temporary archive on the system disk. Containers with the same name or Compose project on the target are not overwritten, and new containers stay stopped. Container dependencies and source volumes in use by other running containers block the import. Source volumes shared within a batch map to a single new volume. Keep source containers stopped during the import."
  zh-CN: "仅支持同一台机器上 Docker Desktop/Rancher Desktop 到 Rusker 的导入。Compose 项目按组导入。项目 YAML、.env 文件及项目目录保留在原处，不修改也不复制；bind 挂载继续共享原数据，因此不要同时启动两边。local bridge 网络和普通 local 命名卷会保留原名称与标签迁移；目标中同名资源不会被覆盖。IP 地址和网段可能变化。仅导入已有服务；rootfs 会扁平化，因此之后执行 Compose up 可能重建容器。源容器与原卷数据保持不变；卷复制会创建/清理只读辅助容器，可能准备 busybox 镜像。请为目标数据及系统盘上的 rootfs 临时归档预留空间。目标同名容器或 Compose 项目不会被覆盖，新容器保持停止。容器依赖以及其他运行中容器正在使用的源卷会阻止导入。同批共享源卷映射到同一个新卷。导入期间保持源容器停止。"
desktop_import.unavailable.not_managed:
  en: "Import is only supported into a Rusker-managed Engine; unset DOCKER_HOST and restart Rusker."
  zh-CN: "仅支持导入到 Rusker 管理的 Engine；请取消 DOCKER_HOST 后重新启动 Rusker。"
desktop_import.unavailable.not_connected:
  en: "The target Engine is not connected yet. You can scan sources first; connecting the Rusker Engine is required before importing."
  zh-CN: "目标 Engine 尚未连接。可以先扫描来源；连接 Rusker Engine 后才能导入。"
desktop_import.unavailable.busy:
  en: "A scan, import, or other operation is in progress. Wait for it to finish before importing."
  zh-CN: "扫描、导入或其他操作正在进行，请等待完成后再导入。"
desktop_import.blocked.stop_first:
  en: "Stop this container in %{source} first, then rescan."
  zh-CN: "请先在 %{source} 中停止此容器，再重新扫描。"
desktop_import.blocked.name_conflict:
  en: "The target Engine already has a container with the same name and will not overwrite it; resolve the name conflict first."
  zh-CN: "目标 Engine 已有同名容器，不会覆盖；请先处理名称冲突。"
desktop_import.blocked.project_conflict:
  en: "The target Engine already has a Compose project named %{project}; the project will not be overwritten."
  zh-CN: "目标 Engine 已有名为 %{project} 的 Compose 项目，不会覆盖该项目。"
desktop_import.error.engine_unavailable:
  en: "Container engine service unavailable. Please restart Rusker."
  zh-CN: "容器引擎服务不可用，请重启 Rusker"
desktop_import.error.scan_failed:
  en: "Scanning %{source} failed: %{error}. %{hint}."
  zh-CN: "扫描 %{source} 失败：%{error}。%{hint}。"
desktop_import.error.source_changed:
  en: "The import source has changed. Please rescan and confirm."
  zh-CN: "导入来源已变化，请重新扫描并确认。"
desktop_import.error.selection_changed:
  en: "The state of the selected containers has changed. Please rescan and select again."
  zh-CN: "所选容器状态已变化，请重新扫描并选择。"
desktop_import.error.import_failed:
  en: "Import failed: %{error}. The target may already contain partial data; check the target containers and volumes before retrying."
  zh-CN: "导入失败：%{error}。目标可能已有部分数据，请查看目标容器和卷后再重试。"
desktop_import.error.import_failed_short:
  en: "%{source} import failed. See Settings for details."
  zh-CN: "%{source} 导入失败，请在设置中查看详情"
desktop_import.confirm.title:
  en: "Import %{count} %{source} containers?"
  zh-CN: "导入 %{count} 个 %{source} 容器？"
desktop_import.confirm.description:
  en: "%{names}\n\nImports only from Docker Desktop/Rancher Desktop on this machine; cross-machine imports are not supported. Compose services are imported as a group. Project YAML, .env files, and project directories stay in place and are not modified or copied. Bind mounts share the original data; do not start both copies at once. Local bridge networks and ordinary local named volumes keep their names and labels; same-name target resources are not overwritten. IP addresses and subnets may change. Only existing services are imported. The rootfs is flattened, so a later Compose up may recreate containers.\n\nSource containers must stay stopped. Source containers and original volume data are not modified; volume copying creates and cleans up read-only helper containers and may prepare a busybox image. Source volumes in use by other running containers block the import. Source volumes shared within a batch map to a single new volume. Reserve space on the target disk and system disk for the temporary rootfs archive.\n\nContainers with the same name or Compose project on the target are not overwritten, and new containers do not start automatically. Container dependencies block the import. Do not quit Rusker, change the target Engine, or change application settings during the import."
  zh-CN: "%{names}\n\n仅支持同一台机器上 Docker Desktop/Rancher Desktop 到 Rusker 的导入，不支持跨机器。Compose 服务按组导入。项目 YAML、.env 文件及项目目录保留在原处，不修改也不复制。bind 挂载共享原数据；不要同时启动两边。local bridge 网络和普通 local 命名卷保留原名称与标签；目标中同名资源不会被覆盖。IP 地址和网段可能变化。仅导入已有服务。rootfs 会扁平化，因此之后执行 Compose up 可能重建容器。\n\n源容器必须保持停止，源容器与原卷数据不会被修改；卷复制会创建并清理只读辅助容器，可能准备 busybox 镜像。正在被其他运行中容器使用的源卷会阻止导入。同批共享源卷映射为同一个新卷。请为目标磁盘和系统盘上的 rootfs 临时归档预留空间。\n\n不会覆盖目标同名容器或 Compose 项目，新容器不会自动启动。容器依赖会阻止导入。导入期间不能退出 Rusker、修改目标 Engine 或应用设置。"
