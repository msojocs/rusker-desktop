volumes.exports.empty:
  en: "No exports yet"
  zh-CN: "还没有导出记录"
volumes.exports.empty_hint:
  en: "Files will be listed here after an export finishes, where you can locate them in their folder."
  zh-CN: "导出完成后会在这里列出文件，可在文件夹中定位。"
volumes.exports.reveal:
  en: "Show in folder"
  zh-CN: "在文件夹中显示"
volumes.exports.hint:
  en: "Exports as an uncompressed tar file with entries relative to the volume root, preserving ownership, permissions, and timestamps; restore to any volume via \"Import\". Records are kept only for this session."
  zh-CN: "导出为未压缩的 tar 文件，条目相对卷根目录并保留属主、权限和时间戳，可通过“导入”恢复到任意卷。记录只保留在本次运行期间。"
volumes.exports.running_note:
  en: "This volume is in use by %{count} running containers. If writes continue during export, data may be inconsistent; stopping them first is recommended."
  zh-CN: "该卷正被 %{count} 个运行中的容器使用，导出时若仍在写入，数据可能不一致，建议先停止。"
