volumes.prune.title:
  en: "Prune %{count} unused volumes?"
  zh-CN: "清理 %{count} 个未使用的卷？"
volumes.prune.description:
  en: "The following volumes are not mounted by any container (including stopped containers) and will be permanently deleted:\n"
  zh-CN: "以下卷未被任何容器（包括已停止的容器）挂载，将被永久删除：\n"
volumes.remove_many.title:
  en: "Delete %{count} volumes?"
  zh-CN: "删除 %{count} 个卷？"
volumes.remove_many.description:
  en: "The following volumes and their data will be permanently deleted. This cannot be undone:\n"
  zh-CN: "以下卷及其数据将被永久删除，此操作不可撤销：\n"
volumes.remove_many.in_use_note:
  en: "\n%{count} of these volumes are mounted by containers; the Engine will refuse to delete them, while the rest are deleted normally."
  zh-CN: "\n其中 %{count} 个卷正被容器挂载，Engine 会拒绝删除它们，其余卷照常删除。"
