volumes.create.title:
  en: "Create Volume"
  zh-CN: "创建卷"
volumes.create.name_label:
  en: "Volume name"
  zh-CN: "卷名称"
volumes.create.name_hint:
  en: "Leave empty to let the Engine generate a random name. May contain letters, digits, underscores, dots, and hyphens."
  zh-CN: "留空则由 Engine 生成随机名称。可包含字母、数字、下划线、点和连字符。"
volumes.clone.title:
  en: "Clone volume %{name}"
  zh-CN: "克隆卷 %{name}"
volumes.clone.hint:
  en: "Creates a new volume and copies all data through a temporary %{image} container, preserving ownership, permissions, and timestamps."
  zh-CN: "创建新卷并通过临时 %{image} 容器复制全部数据，保留属主、权限和时间戳。"
volumes.clone.in_use_hint:
  en: "This volume is in use by containers; stopping the related containers first is recommended to keep data consistent."
  zh-CN: "该卷正被容器使用，建议先停止相关容器以保证数据一致。"
volumes.clone.name_label:
  en: "New volume name *"
  zh-CN: "新卷名称 *"
volumes.clone.name_hint:
  en: "May contain letters, digits, underscores, dots, and hyphens."
  zh-CN: "可包含字母、数字、下划线、点和连字符。"
volumes.remove.title:
  en: "Delete volume %{name}?"
  zh-CN: "删除卷 %{name}？"
volumes.remove.description:
  en: "This cannot be undone. All data in the volume will be permanently deleted."
  zh-CN: "此操作不可撤销，卷中的全部数据将被永久删除。"
volumes.remove.in_use:
  en: "This volume is mounted by %{count} containers (including stopped ones). The Engine will refuse to delete a volume that is still referenced; delete those containers first."
  zh-CN: "该卷正被 %{count} 个容器挂载（含已停止的容器）。Engine 会拒绝删除仍被引用的卷，请先删除这些容器。"
volumes.empty.title:
  en: "Empty volume %{name}?"
  zh-CN: "清空卷 %{name}？"
volumes.empty.description:
  en: "All files and directories inside the volume will be permanently deleted; the volume itself is kept. This cannot be undone."
  zh-CN: "将永久删除卷内的全部文件和目录，卷本身保留。此操作不可撤销。"
volumes.empty.running_note:
  en: "\nThis volume is in use by %{count} running containers. Emptying it may cause those containers to misbehave; stopping them first is recommended."
  zh-CN: "\n该卷正被 %{count} 个运行中的容器使用，清空可能导致这些容器异常，建议先停止。"
volumes.import.title:
  en: "Import data into volume %{name}?"
  zh-CN: "导入数据到卷 %{name}？"
volumes.import.description:
  en: "Extracts %{path} into the volume root. Supports tar, tar.gz, tar.bz2, and tar.xz; files with the same name are overwritten, other existing files are kept, and ownership and permissions from the archive are preserved."
  zh-CN: "将 %{path} 解压到卷根目录。支持 tar、tar.gz、tar.bz2 和 tar.xz；同名文件会被覆盖，其他已有文件保留；归档中的属主与权限会保留。"
volumes.size.calculating:
  en: "Calculating…"
  zh-CN: "统计中…"
