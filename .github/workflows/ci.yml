name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # build.rs builds the WSL2 VM helper (helpers/vm-proxy) for Windows.
          targets: ${{ runner.os == 'Windows' && 'x86_64-unknown-linux-musl' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path helpers/vm-proxy/Cargo.toml --check
      - name: Check build
        run: cargo check --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Clippy (VM helper)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --manifest-path helpers/vm-proxy/Cargo.toml -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
