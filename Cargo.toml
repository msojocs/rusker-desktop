[package]
name = "rusker-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "An open-source, cross-platform container desktop manager"
license = "Apache-2.0"

[lib]
name = "rusker_desktop"
path = "src/lib.rs"

[[bin]]
name = "rusker-desktop"
path = "src/main.rs"

[dependencies]
bollard = "0.21.1"
bytes = "1"
directories = "6"
futures-util = "0.3"
gpui-kit = "0.9.0"
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
socket2 = "0.6"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
png = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"

[package.metadata.deb]
name = "rusker-desktop"
maintainer = "msojocs"
section = "devel"
priority = "optional"
extended-description = "Rusker Desktop manages containers and images through a Docker/Podman compatible engine."
depends = "$auto"
recommends = "docker.io | podman"
assets = [
    ["target/release/rusker-desktop", "usr/bin/", "755"],
    ["packaging/linux/rusker-desktop.desktop", "usr/share/applications/", "644"],
    ["LICENSE", "usr/share/doc/rusker-desktop/", "644"],
    ["README.md", "usr/share/doc/rusker-desktop/", "644"],
]

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
